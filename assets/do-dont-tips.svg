<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="What to do and not do when the chat list goes empty">
  <rect width="1200" height="620" rx="16" fill="#F5F5F7"/>
  <g font-family="Segoe UI, system-ui, -apple-system, sans-serif">
    <text x="600" y="60" fill="#1D1D1F" font-size="32" font-weight="700" text-anchor="middle">If the list goes empty</text>
    <text x="600" y="96" fill="#1E8E3E" font-size="22" font-weight="600" text-anchor="middle">Your chats are almost never gone.</text>

    <rect x="60" y="130" width="530" height="400" rx="14" fill="#FFFFFF" stroke="#E5E5EA"/>
    <rect x="60" y="130" width="530" height="56" rx="14" fill="#E8F8EE"/>
    <text x="325" y="166" fill="#1E8E3E" font-size="23" font-weight="700" text-anchor="middle">DO</text>
    <g>
      <circle cx="112" cy="226" r="13" fill="#34C759"/><path d="M106 226 l4 4 8 -9" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="140" y="233" fill="#1D1D1F" font-size="20">Save your chats first</text>
      <circle cx="112" cy="296" r="13" fill="#34C759"/><path d="M106 296 l4 4 8 -9" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="140" y="303" fill="#1D1D1F" font-size="20">Your chat links still work</text>
      <circle cx="112" cy="366" r="13" fill="#34C759"/><path d="M106 366 l4 4 8 -9" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="140" y="373" fill="#1D1D1F" font-size="20">Use the same login always</text>
      <circle cx="112" cy="436" r="13" fill="#34C759"/><path d="M106 436 l4 4 8 -9" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="140" y="443" fill="#1D1D1F" font-size="20">Check the email on the site</text>
    </g>

    <rect x="610" y="130" width="530" height="400" rx="14" fill="#FFFFFF" stroke="#E5E5EA"/>
    <rect x="610" y="130" width="530" height="56" rx="14" fill="#FDECEC"/>
    <text x="875" y="166" fill="#D70015" font-size="23" font-weight="700" text-anchor="middle">DON'T</text>
    <g>
      <circle cx="662" cy="226" r="13" fill="#D70015"/><path d="M656 220 l12 12 M668 220 l-12 12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text x="690" y="233" fill="#1D1D1F" font-size="20">Don't log out yet</text>
      <circle cx="662" cy="296" r="13" fill="#D70015"/><path d="M656 290 l12 12 M668 290 l-12 12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text x="690" y="303" fill="#1D1D1F" font-size="20">Don't clear anything</text>
      <circle cx="662" cy="366" r="13" fill="#D70015"/><path d="M656 360 l12 12 M668 360 l-12 12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text x="690" y="373" fill="#1D1D1F" font-size="20">Don't delete chats in a panic</text>
      <circle cx="662" cy="436" r="13" fill="#D70015"/><path d="M656 430 l12 12 M668 430 l-12 12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text x="690" y="443" fill="#1D1D1F" font-size="20">Don't use cleaning apps yet</text>
    </g>

    <text x="600" y="580" fill="#86868B" font-size="18" text-anchor="middle">Save first, fix later — that keeps a small website problem small.</text>
  </g>
</svg>
