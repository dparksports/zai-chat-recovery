<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Read your saved chats in the app">
  <rect width="1200" height="560" rx="16" fill="#F5F5F7"/>
  <g font-family="Segoe UI, system-ui, -apple-system, sans-serif">
    <text x="600" y="60" fill="#1D1D1F" font-size="32" font-weight="700" text-anchor="middle">Read your chats — right in the app</text>
    <text x="600" y="94" fill="#86868B" font-size="18" text-anchor="middle">Open the "Read my chats" tab. No files to dig through.</text>

    <!-- simple mock: list + one conversation -->
    <rect x="90" y="130" width="700" height="380" rx="14" fill="#FFFFFF" stroke="#E5E5EA"/>
    <rect x="110" y="150" width="200" height="340" rx="10" fill="#F5F5F7"/>
    <rect x="122" y="166" width="176" height="52" rx="8" fill="#E5F1FF"/>
    <text x="134" y="188" fill="#1D1D1F" font-size="15" font-weight="600">Home warranty</text>
    <text x="134" y="208" fill="#86868B" font-size="13">7 messages</text>
    <text x="134" y="252" fill="#1D1D1F" font-size="15">Missing Chats Inquiry</text>
    <text x="134" y="272" fill="#86868B" font-size="13">5 messages</text>
    <text x="134" y="316" fill="#1D1D1F" font-size="15">OCR for PDF photos</text>
    <text x="134" y="336" fill="#86868B" font-size="13">2 messages</text>
    <text x="134" y="380" fill="#1D1D1F" font-size="15">foia, cpra</text>
    <text x="134" y="400" fill="#86868B" font-size="13">14 messages</text>

    <rect x="330" y="166" width="440" height="72" rx="12" fill="#E5F1FF"/>
    <text x="348" y="192" fill="#007AFF" font-size="13" font-weight="700">YOU · Oct 16</text>
    <text x="348" y="218" fill="#1D1D1F" font-size="15">The claim was denied — what now?</text>
    <rect x="330" y="252" width="440" height="120" rx="12" fill="#FFFFFF" stroke="#E5E5EA"/>
    <text x="348" y="278" fill="#86868B" font-size="13" font-weight="700">GLM · Oct 16</text>
    <text x="348" y="304" fill="#1D1D1F" font-size="15">Here's how to appeal a denial…</text>
    <text x="348" y="330" fill="#1D1D1F" font-size="15">Start with the inspection report.</text>
    <rect x="330" y="386" width="200" height="56" rx="10" fill="#F5F5F7"/>
    <text x="346" y="410" fill="#1D1D1F" font-size="14">📄 denial.pdf</text>
    <text x="346" y="430" fill="#007AFF" font-size="13">Open · Show in folder</text>

    <!-- three big callouts -->
    <g>
      <rect x="830" y="130" width="320" height="110" rx="14" fill="#FFFFFF" stroke="#E5E5EA"/>
      <text x="990" y="178" fill="#1D1D1F" font-size="21" font-weight="600" text-anchor="middle">🔍 Search</text>
      <text x="990" y="210" fill="#86868B" font-size="17" text-anchor="middle">Find any chat by its name</text>

      <rect x="830" y="262" width="320" height="110" rx="14" fill="#FFFFFF" stroke="#E5E5EA"/>
      <text x="990" y="310" fill="#1D1D1F" font-size="21" font-weight="600" text-anchor="middle">🖼️ Photos and files</text>
      <text x="990" y="342" fill="#86868B" font-size="17" text-anchor="middle">Shown where they appeared</text>

      <rect x="830" y="394" width="320" height="110" rx="14" fill="#FFFFFF" stroke="#E5E5EA"/>
      <text x="990" y="442" fill="#1D1D1F" font-size="21" font-weight="600" text-anchor="middle">🔗 One click away</text>
      <text x="990" y="474" fill="#86868B" font-size="17" text-anchor="middle">Opens the chat on the website</text>
    </g>

    <text x="600" y="540" fill="#86868B" font-size="18" text-anchor="middle">Your saved chats, readable any time — even if the website's list is still empty.</text>
  </g>
</svg>
