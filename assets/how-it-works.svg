<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="How Z.ai Chat Recovery works">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="640" rx="16" fill="url(#bg2)"/>
  <g font-family="Segoe UI, system-ui, -apple-system, sans-serif">
    <text x="600" y="64" fill="#e2e8f0" font-size="32" font-weight="700" text-anchor="middle">How the recovery works</text>
    <text x="600" y="98" fill="#94a3b8" font-size="18" text-anchor="middle">Three read-only API calls &#8212; nothing on your account is ever modified</text>

    <!-- step 1 -->
    <g>
      <rect x="60" y="150" width="240" height="270" rx="14" fill="#111b2e" stroke="#1e293b"/>
      <circle cx="180" cy="200" r="24" fill="#0e7490" opacity="0.5"/>
      <text x="180" y="208" fill="#67e8f9" font-size="22" font-weight="700" text-anchor="middle">1</text>
      <text x="180" y="258" fill="#e2e8f0" font-size="21" font-weight="600" text-anchor="middle">Find your session</text>
      <text x="180" y="292" fill="#94a3b8" font-size="15" text-anchor="middle">Scans Chrome / Edge / Brave</text>
      <text x="180" y="314" fill="#94a3b8" font-size="15" text-anchor="middle">local storage for the chat.z.ai</text>
      <text x="180" y="336" fill="#94a3b8" font-size="15" text-anchor="middle">session token &#8212; real accounts</text>
      <text x="180" y="358" fill="#94a3b8" font-size="15" text-anchor="middle">are preferred over guest ones</text>
    </g>
    <path d="M310 285 h48" stroke="#22d3ee" stroke-width="3" marker-end="url(#arr)"/>
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/>
      </marker>
    </defs>

    <!-- step 2 -->
    <g>
      <rect x="368" y="150" width="240" height="270" rx="14" fill="#111b2e" stroke="#1e293b"/>
      <circle cx="488" cy="200" r="24" fill="#166534" opacity="0.5"/>
      <text x="488" y="208" fill="#86efac" font-size="22" font-weight="700" text-anchor="middle">2</text>
      <text x="488" y="258" fill="#e2e8f0" font-size="21" font-weight="600" text-anchor="middle">Verify &amp; list</text>
      <text x="488" y="292" fill="#94a3b8" font-size="15" text-anchor="middle">GET /api/v1/chats with your</text>
      <text x="488" y="314" fill="#94a3b8" font-size="15" text-anchor="middle">token returns the complete</text>
      <text x="488" y="336" fill="#94a3b8" font-size="15" text-anchor="middle">conversation list &#8212; the API</text>
      <text x="488" y="358" fill="#94a3b8" font-size="15" text-anchor="middle">works even when the</text>
      <text x="488" y="380" fill="#94a3b8" font-size="15" text-anchor="middle">sidebar renders empty</text>
    </g>
    <path d="M618 285 h48" stroke="#22d3ee" stroke-width="3" marker-end="url(#arr)"/>

    <!-- step 3 -->
    <g>
      <rect x="676" y="150" width="240" height="270" rx="14" fill="#111b2e" stroke="#1e293b"/>
      <circle cx="796" cy="200" r="24" fill="#7c2d12" opacity="0.55"/>
      <text x="796" y="208" fill="#fdba74" font-size="22" font-weight="700" text-anchor="middle">3</text>
      <text x="796" y="258" fill="#e2e8f0" font-size="21" font-weight="600" text-anchor="middle">Fetch contents</text>
      <text x="796" y="292" fill="#94a3b8" font-size="15" text-anchor="middle">Per chat: GET /chats/{id} for</text>
      <text x="796" y="314" fill="#94a3b8" font-size="15" text-anchor="middle">the message tree, then</text>
      <text x="796" y="336" fill="#94a3b8" font-size="15" text-anchor="middle">POST &#8230;/messages/batch for</text>
      <text x="796" y="358" fill="#94a3b8" font-size="15" text-anchor="middle">every message body,</text>
      <text x="796" y="380" fill="#94a3b8" font-size="15" text-anchor="middle">paced gently</text>
    </g>
    <path d="M926 285 h48" stroke="#22d3ee" stroke-width="3" marker-end="url(#arr)"/>

    <!-- step 4 -->
    <g>
      <rect x="984" y="150" width="156" height="270" rx="14" fill="#111b2e" stroke="#1e293b"/>
      <circle cx="1062" cy="200" r="24" fill="#4c1d95" opacity="0.55"/>
      <text x="1062" y="208" fill="#c4b5fd" font-size="22" font-weight="700" text-anchor="middle">4</text>
      <text x="1062" y="258" fill="#e2e8f0" font-size="21" font-weight="600" text-anchor="middle">Save</text>
      <text x="1062" y="292" fill="#94a3b8" font-size="15" text-anchor="middle">Markdown</text>
      <text x="1062" y="314" fill="#94a3b8" font-size="15" text-anchor="middle">transcripts,</text>
      <text x="1062" y="336" fill="#94a3b8" font-size="15" text-anchor="middle">lossless JSON,</text>
      <text x="1062" y="358" fill="#94a3b8" font-size="15" text-anchor="middle">INDEX.md and</text>
      <text x="1062" y="380" fill="#94a3b8" font-size="15" text-anchor="middle">direct URLs</text>
    </g>

    <rect x="60" y="470" width="1080" height="110" rx="14" fill="#082f49" stroke="#0e7490" opacity="0.9"/>
    <text x="600" y="512" fill="#67e8f9" font-size="18" font-weight="600" text-anchor="middle">Why this is possible: an empty sidebar is usually a frontend rendering bug.</text>
    <text x="600" y="542" fill="#94a3b8" font-size="16" text-anchor="middle">The conversations stay on the server, and each one opens fine by its direct URL &#8212; chat.z.ai/c/&lt;session-id&gt; &#8212;</text>
    <text x="600" y="564" fill="#94a3b8" font-size="16" text-anchor="middle">which is exactly what this tool collects for you, safely, before anything else changes.</text>
  </g>
</svg>
