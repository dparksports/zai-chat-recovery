<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Z.ai Chat Recovery banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#22d3ee" fill="none" stroke-width="1.5">
    <path d="M940 60 h240 a14 14 0 0 1 14 14 v64 a14 14 0 0 1 -14 14 h-190 l-26 26 v-26 h-24 a14 14 0 0 1 -14 -14 v-64 a14 14 0 0 1 14 -14 z"/>
    <path d="M980 250 h180 a12 12 0 0 1 12 12 v52 a12 12 0 0 1 -12 12 h-140 l-22 22 v-22 h-18 a12 12 0 0 1 -12 -12 v-52 a12 12 0 0 1 12 -12 z"/>
    <circle cx="1020" cy="132" r="3" fill="#22d3ee"/>
    <circle cx="1040" cy="132" r="3" fill="#22d3ee"/>
    <circle cx="1060" cy="132" r="3" fill="#22d3ee"/>
  </g>
  <g font-family="Segoe UI, system-ui, -apple-system, sans-serif">
    <rect x="64" y="52" width="44" height="44" rx="10" fill="url(#accent)"/>
    <path d="M76 74 l8 8 14 -16" stroke="#0b1220" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="140" fill="#e2e8f0" font-size="46" font-weight="700">Z.ai Chat Recovery</text>
    <text x="64" y="184" fill="#94a3b8" font-size="22">Empty sidebar &#8800; lost chats. Recover every conversation, read-only, in one command.</text>
    <g font-size="16" font-weight="600">
      <rect x="64" y="222" width="132" height="36" rx="18" fill="#0e7490" opacity="0.35"/>
      <text x="130" y="245" fill="#67e8f9" text-anchor="middle">read-only</text>
      <rect x="208" y="222" width="168" height="36" rx="18" fill="#166534" opacity="0.35"/>
      <text x="292" y="245" fill="#86efac" text-anchor="middle">zero dependencies</text>
      <rect x="388" y="222" width="196" height="36" rx="18" fill="#7c2d12" opacity="0.45"/>
      <text x="486" y="245" fill="#fdba74" text-anchor="middle">Apache-2.0 license</text>
      <rect x="596" y="222" width="224" height="36" rx="18" fill="#4c1d95" opacity="0.45"/>
      <text x="708" y="245" fill="#c4b5fd" text-anchor="middle">Python &#183; Windows &#183; macOS &#183; Linux</text>
    </g>
    <text x="64" y="310" fill="#64748b" font-size="16">Works even while the chat.z.ai sidebar shows nothing &#8212; finds your session, calls the API, saves transcripts + direct URLs.</text>
  </g>
