<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Two ways to bring a chat back">
  <rect width="1200" height="560" rx="16" fill="#F5F5F7"/>
  <g font-family="Segoe UI, system-ui, -apple-system, sans-serif">
    <text x="600" y="60" fill="#1D1D1F" font-size="32" font-weight="700" text-anchor="middle">Bring a chat back — two ways</text>
    <text x="600" y="94" fill="#86868B" font-size="18" text-anchor="middle">Both use the copy saved on your computer</text>

    <rect x="60" y="130" width="500" height="340" rx="14" fill="#FFFFFF" stroke="#E5E5EA"/>
    <rect x="60" y="130" width="500" height="56" rx="14" fill="#E5F1FF"/>
    <text x="310" y="166" fill="#007AFF" font-size="23" font-weight="700" text-anchor="middle">Continue by paste</text>
    <g>
      <circle cx="112" cy="232" r="13" fill="#007AFF"/><text x="112" y="237" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">1</text>
      <text x="140" y="239" fill="#1D1D1F" font-size="20">Click "Continue by paste"</text>
      <circle cx="112" cy="300" r="13" fill="#007AFF"/><text x="112" y="305" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">2</text>
      <text x="140" y="307" fill="#1D1D1F" font-size="20">Paste into a new chat on the website</text>
      <circle cx="112" cy="368" r="13" fill="#007AFF"/><text x="112" y="373" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">3</text>
      <text x="140" y="375" fill="#1D1D1F" font-size="20">Keep talking where you left off</text>
    </g>
    <text x="310" y="440" fill="#1E8E3E" font-size="18" font-weight="600" text-anchor="middle">Nothing is written to your account</text>

    <rect x="640" y="130" width="500" height="340" rx="14" fill="#FFFFFF" stroke="#E5E5EA"/>
    <rect x="640" y="130" width="500" height="56" rx="14" fill="#FFF3E0"/>
    <text x="890" y="166" fill="#C35C00" font-size="23" font-weight="700" text-anchor="middle">Restore to my account…</text>
    <g>
      <circle cx="692" cy="232" r="13" fill="#C35C00"/><text x="692" y="237" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">1</text>
      <text x="720" y="239" fill="#1D1D1F" font-size="20">Click "Restore to my account…"</text>
      <circle cx="692" cy="300" r="13" fill="#C35C00"/><text x="692" y="305" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">2</text>
      <text x="720" y="307" fill="#1D1D1F" font-size="20">Say yes to the one clear question</text>
      <circle cx="692" cy="368" r="13" fill="#C35C00"/><text x="692" y="373" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">3</text>
      <text x="720" y="375" fill="#1D1D1F" font-size="20">The chat returns as "New Chat"</text>
    </g>
    <text x="890" y="440" fill="#C35C00" font-size="18" font-weight="600" text-anchor="middle">The only write this app can ever do</text>

    <text x="600" y="520" fill="#86868B" font-size="18" text-anchor="middle">You choose. Paste is the safe path; restore puts the chat back on the website.</text>
  </g>
</svg>
